[project]
name = "shizuha-connect"
version = "0.1.0"
description = "Shizuha Connect messaging service"
requires-python = ">=3.11"
dependencies = [
    # PLAT-12776 (closes the PLAT-12655 CVE-2026-15307 risk-acceptance): django
    # 5.2.17 LTS — the only LTS-track fix for GHSA-wvqv-fj8w-qmhm (RCE via
    # GeoDjango spatial lookups; path unreachable in connect — no
    # django.contrib.gis, verified 2026-10-28). Controlled major upgrade:
    # dependency matrix verified at locked versions (DRF 3.17.2, simplejwt
    # 5.5.1, celery-beat 2.9.0, filter 25.1, storages 1.14.6, channels 4.3.2,
    # cors-headers 4.9.0, spectacular 0.29.0 — no django<5.0 caps).
    "Django>=5.2.17,<6.0",
    # MAIL-188 (PLAT-7549): DRF floor at the patched 3.17.2 (CVE-2026-73228/73229).
    "djangorestframework>=3.17.2",
    "django-cors-headers>=4.0",
    "django-filter>=23.0",
    "djangorestframework-simplejwt>=5.3",
    "PyJWT>=2.8",
    "psycopg2-binary>=2.9",
    "channels>=4.0",
    "channels-redis>=4.1",
    "daphne>=4.0",
    "celery>=5.3",
    "django-celery-beat>=2.5",
    "redis>=5.0",
    "drf-spectacular>=0.27",
    "boto3>=1.34",
    "django-storages>=1.14",
    "django-postgres-extensions>=0.9",
    "cryptography>=42.0",
    "prometheus-client>=0.20",
    "python-dateutil>=2.8",
    "requests>=2.31",
    "Pillow>=10.0",
    "python-magic>=0.4",
    "livekit-api>=1.0.0",
    "gunicorn>=21.0",
    "uvicorn>=0.25",
    "whitenoise>=6.6",
    "mcp>=2.0.0",
    # PLAT-4250: floor python-multipart above the vulnerable range pulled via mcp.
    # mcp itself permits >=0.0.9; all known advisories start at introduced:0.
    "python-multipart>=0.0.31",
    "ipython>=8.0",
]

[tool.uv]
package = false
