# Shizuha Origin CI/CD — MULTI-ARCH build + deploy connect (ORIG-7 Plan A).
# Lives in the connect repo; triggers on its own pushes (synced GitHub->Origin every 5m).
# Builds connect for BOTH amd64 + arm64 via two in-cluster kaniko Jobs (arch-matched nodes),
# combines them into a multi-arch manifest list with crane, deploys the list, and verifies.
# Multi-arch = the image runs on any platform node (s1 amd64 OR gx10 arm64) per PLAT-718 —
# no single-arch regression / exec-format crashes. Auth = KUBE_CONFIG_B64 org secret
# (least-privilege origin-ci-deployer SA). No submodule checkout, no docker-in-DinD.
name: deploy-connect
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
    # Forgejo supports on.push.paths (allowlist form only). Frontend-only and
    # docs-only commits are shipped by deploy-frontend.yml, so this backend
    # pipeline rebuilds + reruns the suite only when a backend-relevant path
    # changes. Conservative by design: when unsure whether a path affects the
    # backend image/tests, INCLUDE it here (fail-safe = rebuild, never skip).
    paths:
      - '.forgejo/workflows/deploy.yml'
      - '.forgejo/scripts/**'
      - '.forgejo/recovery/**'
      - '.forgejo/tests/**'
      - 'Dockerfile*'
      - '.dockerignore'
      - 'docker-entrypoint.sh'
      - 'supervisord*.conf'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'manage.py'
      - 'connect/**'
      - 'connectmanager/**'
      - 'mcp-server/**'
      - 'infra/**'
      - 'scripts/**'
      - 'tests/**'
# A workflow cancellation also kills a running Helm process, regardless of a
# deploy-job concurrency group. Queue releases so newer pushes cannot strand
# the Helm release in pending-upgrade after the API has already rolled.
concurrency:
  group: deploy-connect-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-gate:
    # CON deploy red streak: keep the main-branch gate off shared ubuntu-latest.
    # Runs the FULL Django suite + migration graph before any build/deploy — a
    # red suite BLOCKS the deploy (operator 2026-07-14: "forgejo ci must also run
    # all of this ... i thought they run it during ci/cd"). Pre-push hooks are
    # advisory-only for coordinators and bypassable via --no-verify + PR merges
    # bypass them entirely, so the server-side deploy gate is the real backstop.
    runs-on: deploy-lane
    steps:
      - name: Checkout for PLAT-4251 static CI supply-chain check
        uses: actions/checkout@v4
      - name: PLAT-4251 static CI supply-chain guard (no pipe-to-shell; helm checksum)
        run: |
          set -euo pipefail
          bash .forgejo/scripts/check-no-curl-pipe-shell.sh
          python3 -m unittest discover -s .forgejo/tests -v
      - name: Install kubectl + cluster access
        run: |
          set -euo pipefail
          KUBECTL_ARCH="$(uname -m)"; case "$KUBECTL_ARCH" in x86_64) KUBECTL_ARCH=amd64;; aarch64) KUBECTL_ARCH=arm64;; *) echo "Unsupported runner arch: $KUBECTL_ARCH" >&2; exit 1;; esac
          curl -fsSL -o kubectl "http://forgejo-http.origin.svc.cluster.local/api/packages/actions/generic/kubectl/v1.34.1/kubectl-${KUBECTL_ARCH}"
          install -m 0755 kubectl /usr/local/bin/kubectl
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Run Django test suite + migration graph gate before deploy
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          JOB="ci-test-gate-connect-${SHORT}"
          kubectl delete job -n build "${JOB}" --ignore-not-found
          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: build
            labels: { app: ci-test-gate, service: connect, shizuha.io/orig-task: ORIG-21 }
          spec:
            backoffLimit: 0
            # Keep the in-cluster workload inside the runner's 2400s wait.
            # ttlSecondsAfterFinished only applies after completion; without an
            # active deadline, a slow dependency fetch can outlive a red gate.
            # Recent healthy deploy-lane runs have needed 24-28 minutes under
            # contention, so leave enough headroom to report the real test
            # result instead of killing a still-progressing Job at 28m20s.
            activeDeadlineSeconds: 2300
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                initContainers:
                  - name: git-clone
                    image: alpine/git:2.43.0
                    command: ["/bin/sh","-c"]
                    args:
                      - |
                        set -e
                        git clone --depth=50 http://x-token-auth:\${GIT_PASSWORD}@forgejo-http.origin.svc.cluster.local/shizuha-labs/connect.git /workspace/src
                        cd /workspace/src
                        git fetch --depth=1 origin ${{ github.sha }}
                        git checkout --detach ${{ github.sha }}
                    env:
                      - name: GIT_PASSWORD
                        valueFrom: { secretKeyRef: { name: forgejo-token, key: password } }
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                containers:
                  - name: test-gate
                    image: python:3.12-bookworm
                    command: ["/bin/bash","-lc"]
                    args:
                      - |
                        set -euo pipefail
                        export DEBIAN_FRONTEND=noninteractive
                        apt-get -o Acquire::http::Proxy=http://apt-cache.registry.svc.cluster.local:3142 update
                        apt-get -o Acquire::http::Proxy=http://apt-cache.registry.svc.cluster.local:3142 install -y --no-install-recommends postgresql redis-server build-essential libpq-dev
                        pg_ctlcluster 15 main start
                        su postgres -c "psql -c \"ALTER USER postgres PASSWORD 'postgres';\""
                        su postgres -c "createdb shizuha_connect_ci" || true
                        redis-server --daemonize yes
                        cd /workspace/src
                        python -m pip install --index-url http://pip-cache.registry.svc.cluster.local/simple --trusted-host pip-cache.registry.svc.cluster.local --upgrade pip
                        python -m pip install --index-url http://pip-cache.registry.svc.cluster.local/simple --trusted-host pip-cache.registry.svc.cluster.local uv==0.11.26
                        # uv sync --locked follows files.pythonhosted.org URLs
                        # embedded in uv.lock, bypassing the in-cluster cache. Export
                        # the frozen, hash-pinned lock and sync it through the cache.
                        UV_CACHE_DIR=/tmp/uv-cache uv lock --check
                        uv export --frozen --no-dev --no-emit-project \
                          --format requirements.txt --output-file /tmp/ci-requirements.txt
                        uv venv --python python3 /workspace/src/.venv
                        timeout -k 10 600 env UV_CACHE_DIR=/tmp/uv-cache UV_HTTP_TIMEOUT=60 UV_HTTP_RETRIES=10 UV_CONCURRENT_DOWNLOADS=4 \
                          uv pip sync --python /workspace/src/.venv/bin/python --require-hashes \
                          /tmp/ci-requirements.txt \
                          --index-url http://pip-cache.registry.svc.cluster.local/simple \
                          --allow-insecure-host pip-cache.registry.svc.cluster.local
                        export PATH="/workspace/src/.venv/bin:$PATH"
                        export POSTGRES_HOST=127.0.0.1 POSTGRES_PORT=5432 POSTGRES_USER=postgres POSTGRES_PASSWORD=postgres POSTGRES_DB=shizuha_connect_ci
                        export DB_HOST=127.0.0.1 DB_PORT=5432 DB_USER=postgres DB_PASSWORD=postgres DB_NAME=shizuha_connect_ci
                        export REDIS_URL=redis://127.0.0.1:6379/5 CACHE_REDIS_URL=redis://127.0.0.1:6379/6 REDIS_HOST=127.0.0.1 REDIS_PORT=6379 DEBUG=True SECRET_KEY=ci-secret MINIO_ACCESS_KEY=ci-storage MINIO_SECRET_KEY=ci-storage MINIO_ENDPOINT=http://127.0.0.1:9 JWT_SECRET_KEY=ci-secret SHIZUHA_JWT_SIGNING_KEY=ci-secret
                        python manage.py makemigrations --check --dry-run
                        python .forgejo/scripts/check-django-migration-graph.py
                        # FULL test suite — the deploy gate itself, not advisory.
                        # Single-threaded for reliability (no tblib/parallel-DB
                        # edge cases); the whole suite runs in a few minutes,
                        # well inside the kubectl wait timeout below. A single
                        # failing test fails the Job and blocks build-and-deploy.
                        # --keepdb: the pod is ephemeral, so keeping the test DB
                        # has no downside AND skips the end-of-run DROP DATABASE,
                        # which otherwise races lingering channels/async-ORM
                        # connections ("database ... is being accessed by other
                        # users") and fails the gate even when every test passed.
                        python manage.py test --noinput --keepdb --verbosity=1
                        (
                          cd mcp-server
                          ../.venv/bin/python -m unittest test_token_verifier -v
                        )
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                volumes: [{ emptyDir: {}, name: workspace }]
          YAML
          kubectl wait -n build --for=condition=complete "job/${JOB}" --timeout=2400s &
          WP=$!
          while kill -0 "$WP" 2>/dev/null; do
            if kubectl get -n build "job/${JOB}" -o jsonpath='{.status.failed}' 2>/dev/null | grep -q '[1-9]'; then
              echo "::error::Django test + migration gate failed (test failure or migration drift)"
              kubectl logs -n build "job/${JOB}" --all-containers --tail=400 || true
              kill "$WP" 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done
          wait "$WP" || {
            echo "::error::Django test + migration gate failed (timeout)"
            kubectl logs -n build "job/${JOB}" --all-containers --tail=400 || true
            exit 1
          }
          kubectl logs -n build "job/${JOB}" --all-containers --tail=120 || true
  # Build+push the multi-arch image CONCURRENTLY with test-gate. Only the deploy
  # job below gates the rollout on BOTH test-gate AND build, so the long kaniko
  # build no longer waits serially behind the Django suite.
  build:
    runs-on: deploy-lane
    steps:
      - name: Checkout exact triggering revision for monotonic release guard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install kubectl + cluster access
        run: |
          set -euo pipefail
          KUBECTL_ARCH="$(uname -m)"; case "$KUBECTL_ARCH" in x86_64) KUBECTL_ARCH=amd64;; aarch64) KUBECTL_ARCH=arm64;; *) echo "Unsupported runner arch: $KUBECTL_ARCH" >&2; exit 1;; esac
          curl -fsSL -o kubectl "http://forgejo-http.origin.svc.cluster.local/api/packages/actions/generic/kubectl/v1.34.1/kubectl-${KUBECTL_ARCH}"
          install -m 0755 kubectl /usr/local/bin/kubectl
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Verify build completion and credential contracts
        run: python3 -m unittest discover -s .forgejo/tests
      - name: Multi-arch build + verify
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          TAG="connect-${SHORT}"
          REG="registry.registry.svc.cluster.local:5000"
          # The awk-generated Dockerfile lines below reference ${NPM_CONFIG_REGISTRY}/${PIP_*}
          # which the SHELL expands here (set -u) — if unset, the whole step aborts before any
          # build Job is created ("unbound variable" -> "no objects passed to apply"), so connect
          # never ships (2026-06-29 outage). Define them with the same defaults as the ARG lines.
          NPM_CONFIG_REGISTRY="${NPM_CONFIG_REGISTRY:-http://npm-cache.registry.svc.cluster.local:4873/}"
          PIP_INDEX_URL="${PIP_INDEX_URL:-http://pip-cache.registry.svc.cluster.local/simple/}"
          PIP_TRUSTED_HOST="${PIP_TRUSTED_HOST:-pip-cache.registry.svc.cluster.local}"
          echo "Multi-arch build shizuha-connect:${TAG} (amd64 + arm64)"

          render_build_job() {  # $1=arch
            local ARCH="$1"
            cat <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-build-connect-${SHORT}-${ARCH}
            namespace: build
            labels: { app: ci-build, shizuha.io/orig-task: ORIG-7 }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                nodeSelector: { kubernetes.io/arch: ${ARCH} }
                tolerations:
                  - { key: node.shizuha/workstation, operator: Exists, effect: NoSchedule }
                  - { key: shizuha.com/inference-paused, operator: Exists, effect: NoSchedule }
                  # amd64 kaniko on i9-ws times out pushing to registry ClusterIP;
                  # s1 overlay works and carries operator=unschedulable. CI tolerates
                  # the operator-hold taint instead of removing it.
                  - { key: operator, operator: Equal, value: unschedulable, effect: NoSchedule }
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                      - matchExpressions:
                        - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
                        # i9-ws overlay to ns registry is i/o timeout. Keep excluded until
                        # ClusterIP/FORWARD on i9-ws is actually fixed.
                        - { key: kubernetes.io/hostname, operator: NotIn, values: [i9-ws] }
                initContainers:
                  - name: git-clone
                    image: alpine/git:2.43.0
                    command: ["/bin/sh","-c"]
                    args:
                      - |
                        set -e
                        git clone --depth=50 http://x-token-auth:\${GIT_PASSWORD}@forgejo-http.origin.svc.cluster.local/shizuha-labs/connect.git /workspace/src
                        cd /workspace/src && (git checkout ${{ github.sha }} 2>/dev/null || echo "sha not in shallow clone; building default HEAD")
                        if [ -f /workspace/src/Dockerfile ]; then
                          awk '''
                            /^FROM[[:space:]]/ {
                              print
                              print "ARG NPM_CONFIG_REGISTRY=http://npm-cache.registry.svc.cluster.local:4873/"
                              print "ARG PIP_INDEX_URL=http://pip-cache.registry.svc.cluster.local/simple/"
                              print "ARG PIP_TRUSTED_HOST=pip-cache.registry.svc.cluster.local"
                              print "ENV NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY}"
                              print "ENV PIP_INDEX_URL=${PIP_INDEX_URL}"
                              print "ENV PIP_TRUSTED_HOST=${PIP_TRUSTED_HOST}"
                              next
                            }
                            { print }
                          ''' /workspace/src/Dockerfile > /workspace/src/Dockerfile.cache-wired
                          mv /workspace/src/Dockerfile.cache-wired /workspace/src/Dockerfile
                        fi
                    env:
                      - name: GIT_PASSWORD
                        valueFrom: { secretKeyRef: { name: forgejo-token, key: password } }
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                containers:
                  - name: kaniko
                    image: gcr.io/kaniko-project/executor:v1.23.2
                    args:
                      - --context=dir:///workspace/src
                      - --dockerfile=/workspace/src/Dockerfile
                      - --destination=${REG}/shizuha-connect:${TAG}-${ARCH}
                      - --cleanup
                      - --insecure
                      - --skip-tls-verify
                      - --insecure-pull
                      - --registry-mirror=mirror-dockerhub.registry.svc.cluster.local:5000
                      # --registry-mirror only covers Docker Hub; the Dockerfile also pulls
                      # ghcr.io/astral-sh/uv (kaniko fetched it direct + flaked 2026-07-12).
                      # Map ghcr.io to the in-cluster pull-through proxy so it cannot flake.
                      - --registry-map=ghcr.io=mirror-ghcr.registry.svc.cluster.local:5000
                      - --build-arg=NPM_CONFIG_REGISTRY=http://npm-cache.registry.svc.cluster.local:4873/
                      - --build-arg=PIP_INDEX_URL=http://pip-cache.registry.svc.cluster.local/simple/
                      - --build-arg=PIP_TRUSTED_HOST=pip-cache.registry.svc.cluster.local
                      # kaniko LAYER cache (perf, operator 2026-07-11 "cache everywhere"):
                      # was --cache=false → every build re-ran apt-get + uv sync
                      # (all Python deps) from scratch even when pyproject/uv.lock
                      # were unchanged (~18min builds). Cache the base+deps layers
                      # to the in-cluster registry so only the source COPY +
                      # collectstatic layers rebuild. Per-arch cache repos so the
                      # amd64/arm64 layer digests never collide.
                      - --cache=true
                      - --cache-repo=${REG}/kaniko-cache/connect-${ARCH}
                      - --cache-copy-layers=true
                      - --cache-ttl=336h
                      - --compressed-caching=false
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                volumes: [{ emptyDir: {}, name: workspace }]
          YAML
          }

          # Launch both arch builds in parallel
          BUILD_GUARD_CONFIGMAP="origin-ci-build-guard-650fec631781"
          BUILD_GUARD_SHA256="650fec631781edce0e4980f0fb07b12ab78b67b1faf780b214d12a40f9dddcf6"
          BUILD_GUARD="${RUNNER_TEMP:-/tmp}/origin-ci-build-guard.py"
          kubectl get "configmap/${BUILD_GUARD_CONFIGMAP}" -n origin \
            -o jsonpath='{.data.guard\.py}' >"$BUILD_GUARD"
          echo "${BUILD_GUARD_SHA256}  ${BUILD_GUARD}" | sha256sum -c -
          job_name_for_arch() {
            local ARCH="$1"
            render_build_job "$ARCH" | awk '$1 == "name:" { print $2; exit }'
          }
          AMD64_JOB="$(job_name_for_arch amd64)"
          ARM64_JOB="$(job_name_for_arch arm64)"
          test -n "$AMD64_JOB" -a -n "$ARM64_JOB"
          cleanup_build_pair() {
            python3 "$BUILD_GUARD" cleanup \
              --namespace build --job "$AMD64_JOB" --job "$ARM64_JOB"
          }
          cleanup_on_failure() {
            rc=$?
            if [ "$rc" -ne 0 ]; then cleanup_build_pair || true; fi
            exit "$rc"
          }
          trap cleanup_on_failure EXIT INT TERM
          python3 "$BUILD_GUARD" preflight --arch amd64 --arch arm64
          cleanup_build_pair
          render_build_job amd64 | kubectl apply -f -
          render_build_job arm64 | kubectl apply -f -
          python3 "$BUILD_GUARD" wait-pair --namespace build \
            --job "amd64=${AMD64_JOB}" --job "arm64=${ARM64_JOB}" \
            --timeout-seconds 1800
          trap - EXIT INT TERM

          # wait-pair already records each architecture completion. Do not re-read
          # completed Jobs here: TTL cleanup can remove the faster architecture
          # while the slower build is still finishing.
          echo "Both arch builds done."

          # Combine into a multi-arch manifest list with crane
          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-manifest-connect-${SHORT}
            namespace: build
            labels: { app: ci-manifest, shizuha.io/orig-task: ORIG-7 }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: crane
                    image: gcr.io/go-containerregistry/crane:latest
                    # Image entrypoint IS the crane binary (distroless, no shell) — pass args directly.
                    args:
                      - index
                      - append
                      - --insecure
                      - -t
                      - ${REG}/shizuha-connect:${TAG}
                      - -m
                      - ${REG}/shizuha-connect:${TAG}-amd64
                      - -m
                      - ${REG}/shizuha-connect:${TAG}-arm64
          YAML
          kubectl wait -n build --for=condition=complete "job/ci-manifest-connect-${SHORT}" --timeout=300s || {
            echo "::error::manifest combine failed"; kubectl logs -n build "job/ci-manifest-connect-${SHORT}" --tail=30 || true; exit 1; }

          # Deploy the multi-arch manifest list
          verify_manifest() {
            local REPO="$1"
            local IMAGE_TAG="$2"
            local JOB="ci-verify-${REPO}-${SHORT}"
            cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: build
            labels: { app: ci-verify, service: ${REPO} }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: manifest-check
                    image: python:3.12-alpine
                    command: ["python", "-c"]
                    args:
                      - |
                        import json, urllib.request
                        url = "http://${REG}/v2/${REPO}/manifests/${IMAGE_TAG}"
                        accept = ",".join([
                            "application/vnd.oci.image.index.v1+json",
                            "application/vnd.docker.distribution.manifest.list.v2+json",
                        ])
                        req = urllib.request.Request(url, headers={"Accept": accept})
                        with urllib.request.urlopen(req, timeout=30) as resp:
                            manifest = json.load(resp)
                        platforms = {
                            f"{m.get('platform', {}).get('os')}/{m.get('platform', {}).get('architecture')}"
                            for m in manifest.get("manifests", [])
                        }
                        missing = {"linux/amd64", "linux/arm64"} - platforms
                        print(f"{url} platforms={sorted(platforms)}")
                        if missing:
                            raise SystemExit(f"missing required platform(s): {sorted(missing)}")
          YAML
            kubectl wait -n build --for=condition=complete "job/${JOB}" --timeout=120s || {
              echo "::error::manifest verification failed"
              kubectl logs -n build "job/${JOB}" --tail=80 || true
              exit 1
            }
            kubectl logs -n build "job/${JOB}" --tail=20 || true
          }
          verify_manifest "shizuha-connect" "${TAG}"

  # Rollout gate: depends on BOTH test-gate AND build. Neither a red suite nor a
  # failed build can reach the cluster, but they now run in parallel instead of
  # build waiting behind test-gate.
  deploy:
    needs: [test-gate, build]
    concurrency:
      # The backend Helm release also renders the separately-built frontend
      # Deployment. Share one release lock with deploy-frontend.yml so Helm
      # cannot restore a frontend tag that it snapshotted before the frontend
      # rollout completed.
      group: deploy-connect-release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: deploy-lane
    steps:
      - name: Checkout exact triggering revision for monotonic release guard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install kubectl + cluster access
        run: |
          set -euo pipefail
          KUBECTL_ARCH="$(uname -m)"; case "$KUBECTL_ARCH" in x86_64) KUBECTL_ARCH=amd64;; aarch64) KUBECTL_ARCH=arm64;; *) echo "Unsupported runner arch: $KUBECTL_ARCH" >&2; exit 1;; esac
          curl -fsSL -o kubectl "http://forgejo-http.origin.svc.cluster.local/api/packages/actions/generic/kubectl/v1.34.1/kubectl-${KUBECTL_ARCH}"
          install -m 0755 kubectl /usr/local/bin/kubectl
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy multi-arch image + verify
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          TAG="connect-${SHORT}"
          REG="registry.registry.svc.cluster.local:5000"
          IMG="localhost:30500/shizuha-connect:${TAG}"
          CONNECT_DEPLOYS="shizuha-connect shizuha-connect-worker shizuha-connect-beat"

          install_helm() {
            if command -v helm >/dev/null 2>&1; then return; fi
            # PLAT-4678: helm vendored in the Origin package registry — no WAN.
            # PLAT-4251: pin official published SHA-256 and fail closed before extract
            # (download-verify-install; never curl|bash).
            HARCH=$(uname -m); case "$HARCH" in x86_64) HARCH=amd64;; aarch64) HARCH=arm64;; esac
            case "$HARCH" in
              amd64) HELM_SHA=fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179 ;;
              arm64) HELM_SHA=d3f8f15b3d9ec8c8678fbf3280c3e5902efabe5912e2f9fcf29107efbc8ead69 ;;
              *) echo "Unsupported helm arch: $HARCH" >&2; return 1 ;;
            esac
            curl -fsSL -o /tmp/helm.tgz "https://origin.shizuha.com/api/packages/actions/generic/helm/v3.16.4/helm-v3.16.4-linux-${HARCH}.tar.gz"
            echo "${HELM_SHA}  /tmp/helm.tgz" | sha256sum -c -
            tar xzf /tmp/helm.tgz -C /tmp && install -m 0755 /tmp/linux-${HARCH}/helm /usr/local/bin/helm
          }

          forgejo_api() {
            # PLAT-4689: use in-cluster DNS + Host origin.shizuha.com. Raw ClusterIP
            # without Host returns HTML 403 for private Contents API even with a
            # valid token (token length 40 still 403'd as body_raw <!DOCTYPE html>).
            FGJO_URL="http://forgejo-http.origin.svc.cluster.local"
            FGJO_HOST_HEADER="origin.shizuha.com"
            VALS_PATH="k3s%2Fcharts%2Fshizuha-connect%2Fvalues.yaml"
          }

          # PLAT-4689: never use curl -sf + stdout discard on deploy Contents API.
          # Exit 22 with no status/body made the PUT failure undiagnosable (tasks
          # 7382/7396/7399). Capture HTTP code + body on stderr; body JSON via file
          # (never mix diagnostics into command-substitution stdout).
          # Length-only secret probe (never print value) — empty injection → 403 HTML.
          DEPLOY_PUSH_TOKEN_VALUE='${{ secrets.DEPLOY_PUSH_TOKEN }}'
          echo "PLAT-4689 DEPLOY_PUSH_TOKEN length=${#DEPLOY_PUSH_TOKEN_VALUE}"
          if [ "${#DEPLOY_PUSH_TOKEN_VALUE}" -lt 20 ]; then
            echo "::error::DEPLOY_PUSH_TOKEN missing/empty in runner (len=${#DEPLOY_PUSH_TOKEN_VALUE})"
            exit 22
          fi
          forgejo_contents_curl() {
            # usage: forgejo_contents_curl METHOD URL [extra curl args...]
            # on success: body in FGJO_HTTP_BODY_FILE; on failure: stderr diagnostics, return 22
            # No nested heredoc (act/bash EOF issues); one-line python -c only.
            local method="$1"; shift
            local url="$1"; shift
            local code body_file
            body_file="$(mktemp /tmp/fgjo-http-body.XXXXXX)"
            code="$(
              curl -sS -o "${body_file}" -w '%{http_code}' \
                -X "${method}" \
                -H "Host: ${FGJO_HOST_HEADER:-origin.shizuha.com}" \
                -H "Authorization: token ${DEPLOY_PUSH_TOKEN_VALUE}" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                "$@" \
                "${url}" 2>/tmp/fgjo-curl-stderr.$$ || true
            )"
            if [ -s /tmp/fgjo-curl-stderr.$$ ]; then
              echo "::error::deploy contents ${method} curl transport error url=${url}" >&2
              sed 's/[0-9a-f]\{20,\}/[REDACTED]/gi' /tmp/fgjo-curl-stderr.$$ >&2 || true
            fi
            rm -f /tmp/fgjo-curl-stderr.$$
            FGJO_HTTP_CODE="${code:-000}"
            FGJO_HTTP_BODY_FILE="${body_file}"
            if ! printf '%s' "${FGJO_HTTP_CODE}" | grep -Eq '^(200|201)$'; then
              echo "::error::deploy contents ${method} HTTP ${FGJO_HTTP_CODE} url=${url}" >&2
              python3 -c 'import json,re,sys,pathlib;p=sys.argv[1];b=pathlib.Path(p).read_bytes()[:4000] if pathlib.Path(p).exists() else b"";t=b.decode("utf-8","replace");t=re.sub(r"(?i)(token\s+)[0-9a-f]{20,}",r"\1[REDACTED]",t);print(("body: "+json.dumps(json.loads(t))[:1500]) if t.strip()[:1] in "{[" else ("body_raw: "+(t[:1500] or "<empty>")))' "${body_file}" >&2 || true
              rm -f "${body_file}"
              FGJO_HTTP_BODY_FILE=""
              return 22
            fi
            return 0
          }

          read_deploy_values_to() {
            # $1 = destination file for Contents API JSON
            local dest="$1"
            forgejo_api
            forgejo_contents_curl GET \
              "${FGJO_URL}/api/v1/repos/shizuha-labs/deploy/contents/${VALS_PATH}" \
              || return $?
            cp "${FGJO_HTTP_BODY_FILE}" "${dest}"
            rm -f "${FGJO_HTTP_BODY_FILE}"
            FGJO_HTTP_BODY_FILE=""
          }

          update_deploy_values_backend_tags() {
            local IMAGE_TAG="$1"
            local FILE_SHA NEW_B64 BODY
            forgejo_api
            read_deploy_values_to /tmp/connect-deploy-values-resp.json
            FILE_SHA="$(python3 -c 'import json; print(json.load(open("/tmp/connect-deploy-values-resp.json"))["sha"])')"
            python3 -c 'import json,base64; print(base64.b64decode(json.load(open("/tmp/connect-deploy-values-resp.json"))["content"]).decode())' > /tmp/connect-values.yaml
            python3 - "${IMAGE_TAG}" /tmp/connect-values.yaml <<'PY'
          import re
          import sys

          tag = sys.argv[1]
          path = sys.argv[2]
          text = open(path).read()

          patterns = {
              "image.tag": r'(?ms)(^image:\n(?:.*?\n)*?^  tag: )[^\n]*',
              "worker.image.tag": r'(?ms)(^worker:\n(?:.*?\n)*?^  image:\n(?:.*?\n)*?^    tag: )[^\n]*',
              "beat.image.tag": r'(?ms)(^beat:\n(?:.*?\n)*?^  image:\n(?:.*?\n)*?^    tag: )[^\n]*',
          }

          new = text
          for name, pattern in patterns.items():
              # An unchanged re.sub result is NOT proof the key is missing: a rerun
              # after a partial failure finds the tag already written and must pass
              # (task 3316 died here retrying 3280's helm failure).
              if not re.search(pattern, new):
                  raise SystemExit(f'{name} not found in shizuha-connect values.yaml')
              new = re.sub(pattern, r'\g<1>' + tag, new, count=1)
          open(path, 'w').write(new)
          if new == text:
              print(f'desired tags already {tag}; skipping deploy-repo write')
              open('/tmp/connect-values-unchanged', 'w').write('1')
          PY
            if [ -f /tmp/connect-values-unchanged ]; then
              rm -f /tmp/connect-values-unchanged
              return 0
            fi
            NEW_B64="$(base64 -w0 /tmp/connect-values.yaml)"
            # Explicit branch=master: deploy default is master and branch
            # protection whitelists only shizuha (uid 1). DEPLOY_PUSH_TOKEN must
            # be a shizuha-scoped token (PLAT-4689).
            BODY="$(python3 -c "import json,sys; print(json.dumps({'message':'ci(shizuha-connect): desired backend/worker/beat tag ${IMAGE_TAG} before rollout [ci skip]','content':sys.argv[1],'sha':'${FILE_SHA}','branch':'master','committer':{'email':'ci@shizuha.com','name':'Origin CI'}}))" "${NEW_B64}")"
            forgejo_contents_curl PUT \
              "${FGJO_URL}/api/v1/repos/shizuha-labs/deploy/contents/${VALS_PATH}" \
              -d "${BODY}"
            rm -f "${FGJO_HTTP_BODY_FILE}"
          }

          assert_deploy_values_backend_tags() {
            local EXPECTED="$1"
            # NB: data must come in via a file+argv, NOT a pipe — piping into
            # `python3 - <<'PY'` can't work: the heredoc claims stdin for the
            # program, so json.load(sys.stdin) reads EOF and dies at char 0.
            read_deploy_values_to /tmp/connect-deploy-values-resp.json
            python3 - "${EXPECTED}" /tmp/connect-deploy-values-resp.json <<'PY'
          import base64, json, re, sys

          expected = sys.argv[1]
          text = base64.b64decode(json.load(open(sys.argv[2]))["content"]).decode()
          patterns = {
              "image.tag": r'(?ms)^image:\n(?:.*?\n)*?^  tag: ([^\n]*)',
              "worker.image.tag": r'(?ms)^worker:\n(?:.*?\n)*?^  image:\n(?:.*?\n)*?^    tag: ([^\n]*)',
              "beat.image.tag": r'(?ms)^beat:\n(?:.*?\n)*?^  image:\n(?:.*?\n)*?^    tag: ([^\n]*)',
          }
          bad = []
          for name, pattern in patterns.items():
              match = re.search(pattern, text)
              actual = match.group(1).strip() if match else ""
              print(f"deploy repo desired {name}: {actual}")
              if actual != expected:
                  bad.append(f"{name}={actual!r}")
          if bad:
              raise SystemExit(f"deploy repo desired tag mismatch: {', '.join(bad)} != {expected!r}")
          PY
          }

          clone_deploy_chart() {
            forgejo_api
            rm -rf /tmp/deploy-chart
            git -c http.extraHeader="Authorization: token ${DEPLOY_PUSH_TOKEN_VALUE}" \
              -c http.extraHeader="Host: ${FGJO_HOST_HEADER:-origin.shizuha.com}" \
              clone --depth=1 "${FGJO_URL}/shizuha-labs/deploy.git" /tmp/deploy-chart
          }

          # CON-136: update the declarative Helm values FIRST, then use Helm to roll
          # every backend image consumer. Direct kubectl set-image caused the CON-135
          # drift: Helm still recorded an older/nonexistent tag and routine upgrades
          # could revert the hotfix. Backend, worker, and beat run the same image.
          set +e
          .forgejo/scripts/monotonic-release-guard.sh shizuha shizuha-connect "${{ github.sha }}"
          GUARD_RC="$?"
          set -e
          if [ "${GUARD_RC}" = 10 ]; then exit 0; fi
          if [ "${GUARD_RC}" != 0 ]; then exit "${GUARD_RC}"; fi
          update_deploy_values_backend_tags "${TAG}"
          assert_deploy_values_backend_tags "${TAG}"
          # Capture the independent frontend before a pinned recovery rollback.
          LIVE_FE_TAG="$(kubectl get deploy -n shizuha shizuha-connect-frontend -o jsonpath='{.spec.template.spec.containers[0].image}' | sed -n 's|.*/shizuha-connect-frontend:||p')"
          test -n "${LIVE_FE_TAG}"
          install_helm
          CONNECT_RECOVERY_ORIGIN_TOKEN="${DEPLOY_PUSH_TOKEN_VALUE}" \
            python3 .forgejo/recovery/recover_cancelled_release.py
          clone_deploy_chart

          # The shizuha-connect chart declares a LOCAL subchart dependency
          # (Chart.yaml: shizuha-common, repository file://../shizuha-common) that
          # is NOT vendored under charts/ in the deploy repo. `helm upgrade` aborts
          # with "found in Chart.yaml, but missing in charts/ directory:
          # shizuha-common" unless the dependency is built first. `dependency build`
          # uses Chart.lock when present; fall back to `dependency update` (which
          # regenerates the lock) so this works whether or not a lock is committed.
          # file://-only deps need no chart repo / network.
          helm dependency build /tmp/deploy-chart/k3s/charts/shizuha-connect \
            || helm dependency update /tmp/deploy-chart/k3s/charts/shizuha-connect

          echo "Rolling shizuha-connect Helm release to ${IMG} for web/API + worker + beat"
          # Chart.yaml declares a file://../shizuha-common dependency; a fresh
          # clone has no charts/ dir, so helm errors "missing in charts/
          # directory: shizuha-common" without this build step.
          helm dependency build /tmp/deploy-chart/k3s/charts/shizuha-connect
          # Backend helm must NOT clobber the separately-deployed frontend image.
          # Reconcile every other setting from the reviewed deploy chart: retained
          # Helm values have previously restored obsolete single-node selectors
          # and made Connect unavailable when that node failed (CON-255). Preserve
          # only the independently released live frontend tag.
          HELM_FE_ARGS=()
          if [ -n "${LIVE_FE_TAG}" ]; then
            echo "Preserving live frontend image tag: ${LIVE_FE_TAG}"
            HELM_FE_ARGS=(--set "frontend.image.tag=${LIVE_FE_TAG}")
          fi
          helm upgrade shizuha-connect /tmp/deploy-chart/k3s/charts/shizuha-connect \
            --namespace shizuha \
            --reset-values \
            --set image.repository=localhost:30500/shizuha-connect \
            --set image.tag="${TAG}" \
            --set worker.image.repository=localhost:30500/shizuha-connect \
            --set worker.image.tag="${TAG}" \
            --set-json 'worker.livenessProbe={"exec":{"command":["sh","-c","/app/.venv/bin/celery -A connectmanager inspect ping --destination \"celery@$HOSTNAME\" --timeout=5 | grep -q pong"]},"initialDelaySeconds":30,"periodSeconds":30,"timeoutSeconds":10,"failureThreshold":3}' \
            --set-json 'worker.readinessProbe={"exec":{"command":["sh","-c","/app/.venv/bin/celery -A connectmanager inspect ping --destination \"celery@$HOSTNAME\" --timeout=5 | grep -q pong"]},"initialDelaySeconds":10,"periodSeconds":15,"timeoutSeconds":10,"failureThreshold":3}' \
            --set beat.image.repository=localhost:30500/shizuha-connect \
            --set beat.image.tag="${TAG}" \
            "${HELM_FE_ARGS[@]}" \
            --wait --timeout=10m

          for D in ${CONNECT_DEPLOYS}; do
            kubectl rollout status -n shizuha "deploy/${D}" --timeout=300s
            LIVE="$(kubectl get deploy -n shizuha "${D}" -o jsonpath='{.spec.template.spec.containers[0].image}')"
            echo "${D} live: ${LIVE}"
            echo "${LIVE}" | grep -q "${TAG}" || { echo "::error::${D} image mismatch"; exit 1; }
          done

          helm get values shizuha-connect -n shizuha -o yaml > /tmp/connect-release-values.yaml
          python3 - "${TAG}" /tmp/connect-release-values.yaml <<'PY'
          import re
          import sys

          expected = sys.argv[1]
          text = open(sys.argv[2]).read()
          patterns = {
              "image.tag": r'(?ms)^image:\n(?:.*?\n)*?^  tag: ([^\n]*)',
              "worker.image.tag": r'(?ms)^worker:\n(?:.*?\n)*?^  image:\n(?:.*?\n)*?^    tag: ([^\n]*)',
              "beat.image.tag": r'(?ms)^beat:\n(?:.*?\n)*?^  image:\n(?:.*?\n)*?^    tag: ([^\n]*)',
          }
          bad = []
          for name, pattern in patterns.items():
              match = re.search(pattern, text)
              actual = match.group(1).strip() if match else ""
              print(f"helm release {name}: {actual}")
              if actual != expected:
                  bad.append(f"{name}={actual!r}")
          if bad:
              raise SystemExit(f"helm release tag mismatch: {', '.join(bad)} != {expected!r}")
          PY
          echo "OK multi-arch ${TAG}; Helm release and live web/worker/beat images match"
          for D in ${CONNECT_DEPLOYS}; do
            kubectl annotate -n shizuha "deploy/${D}" shizuha.io/last-successful-sha="${{ github.sha }}" --overwrite
          done
          # DeploymentEvent is post-rollout evidence, not part of the rollout
          # transaction. Keep it fail-loud in the log without rewriting a
          # converged deployment as failed when task correlation is missing.
          # CON-231 (2026-10-19): the deploy-lane runner has no forgejo-token
          # secret — ns-origin read NotFound, build-ns unreadable by the
          # runner SA — so the recorder's inline fallback chain always ended
          # PR_NUMBER=0 and Pulse's authoritative ingest dropped the rollout
          # evidence (observed on deploy-connect run 943 at 2026-10-17
          # 13:20:12Z: "DeploymentEvent did not correlate to any linked
          # Pulse task"). The runner already holds DEPLOY_PUSH_TOKEN (used
          # for git push + Contents PUT) and the recorder accepts it as
          # FORGEJO_TOKEN; pass it through. Degrades safely to PR_NUMBER=0
          # if the token is empty, exactly as before.
          if ! FORGEJO_TOKEN="${DEPLOY_PUSH_TOKEN_VALUE}" .forgejo/scripts/record-deployment-event.sh \
            CON shizuha shizuha-connect backend shizuha-connect \
            "localhost:30500/shizuha-connect:${TAG}" \
            /connect/feed,/connect/messages; then
            echo "::warning::backend rollout succeeded but DeploymentEvent recording failed"
          fi
