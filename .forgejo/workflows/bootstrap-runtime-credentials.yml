name: Project existing Connect runtime credentials
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .forgejo/scripts/ensure-runtime-credentials.py
      - .forgejo/workflows/bootstrap-runtime-credentials.yml
jobs:
  bootstrap:
    runs-on: deploy-lane
    steps:
      - uses: actions/checkout@v4
      - name: Install cluster client
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"; case "$ARCH" in x86_64) ARCH=amd64;; aarch64) ARCH=arm64;; *) exit 1;; esac
          curl -fsSL -o /usr/local/bin/kubectl "http://forgejo-http.origin.svc.cluster.local/api/packages/actions/generic/kubectl/v1.34.1/kubectl-${ARCH}"
          chmod 755 /usr/local/bin/kubectl
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Verify bootstrap fail-closed tests
        run: python3 -m unittest discover -s .forgejo/tests -p test_runtime_credentials.py
      - name: Project verified effective settings
        run: python3 .forgejo/scripts/ensure-runtime-credentials.py
      - name: Remove temporary exact-pod execution grant
        if: always()
        run: |
          set -euo pipefail
          kubectl -n shizuha delete rolebinding origin-ci-connect-credentials-exec --ignore-not-found
          kubectl -n shizuha delete role origin-ci-connect-credentials-exec --ignore-not-found
