<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shizuha Connect</title>
    <meta name="description" content="Shizuha Connect — professional network and public software engineering job catalog." />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('shizuha-connect-theme') || localStorage.getItem('shizuha_theme')
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.classList.add(t)
          document.documentElement.dataset.theme = t
        } catch (e) { /* private mode */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
