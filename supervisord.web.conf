[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:mcp-server]
command=python /app/mcp-server/connect_server.py --http-port 18108
directory=/app/mcp-server
user=root
autostart=true
autorestart=true
startsecs=3
startretries=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=SHIZUHA_CONNECT_URL="http://localhost:8019",SHIZUHA_MCP_OAUTH_ENFORCE="true"
priority=10

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:django]
# CON-97: application-close-timeout is how long daphne waits for an app-instance
# to shut down after its connection closes — it should be SECONDS (cleanup), not
# minutes. At 600s a WS app-instance that hangs on shutdown occupied daphne for
# 10 min, so hung instances piled up and saturated the process → WS handshakes
# 502'd fleet-wide. 30s reclaims a hung instance promptly so they can't accumulate.
command=daphne -b 0.0.0.0 -p 8019 --application-close-timeout 30 connectmanager.asgi:application
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"
priority=2
