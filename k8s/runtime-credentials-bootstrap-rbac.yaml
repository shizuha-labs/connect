# Privileged, create-once prerequisite. Never replace existing Secret data.
apiVersion: v1
kind: Secret
metadata:
  name: connect-runtime-credentials
  namespace: shizuha
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: origin-ci-connect-credentials
  namespace: shizuha
rules:
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [connect-runtime-credentials]
    verbs: [get, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    resourceNames: [origin-ci-connect-credentials-exec]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: origin-ci-connect-credentials
  namespace: shizuha
subjects:
  - kind: ServiceAccount
    name: origin-ci-deployer
    namespace: origin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: origin-ci-connect-credentials
