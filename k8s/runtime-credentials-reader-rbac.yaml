# Apply after immutable projection succeeds; CI can verify but cannot rewrite the target.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: origin-ci-connect-credentials
  namespace: shizuha
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - connect-runtime-credentials
  verbs:
  - get
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  resourceNames:
  - origin-ci-connect-credentials-exec
  verbs:
  - delete
